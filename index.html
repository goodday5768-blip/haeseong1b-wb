<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>해성고 1학년 10단계 워크북 (교과서·지금필수)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>

:root{--bg:#f5f5f2;--card:#fff;--ink:#1c1d21;--sub:#686a72;--line:#e1e0da;--acc:#2f5bd3;--acc2:#e8eefc;--ok:#1f8a4c;--okbg:#e5f4ea;--ng:#c8372d;--ngbg:#fbe9e7;--box:#f0efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--ok:#5cc98a;--okbg:#17301f;--ng:#ff7b70;--ngbg:#3a1d1b;--box:#29292e}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--ok:#5cc98a;--okbg:#17301f;--ng:#ff7b70;--ngbg:#3a1d1b;--box:#29292e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(16px*var(--fz,1))/1.6 "Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
button:focus-visible,.opt:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 80px}
.brand{margin:0 0 16px;background:#fff;border:1px solid #E8D9B0;border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.10);color-scheme:light}
.brand img{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;border-radius:6px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:calc(22px*var(--fz,1));margin:0;letter-spacing:-.3px;text-wrap:balance}
h1 small{display:block;font-size:calc(13px*var(--fz,1));color:var(--sub);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
#name{flex:1;min-width:160px}
button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.muted{color:var(--sub);font-size:calc(14px*var(--fz,1))}
.grp{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.grp:first-of-type{border-top:0;margin-top:4px;padding-top:0}
.grphead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grphead b{font-size:calc(15px*var(--fz,1))}
.grphead button{padding:5px 12px;font-size:calc(13px*var(--fz,1))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:8px}
.grid button{padding:8px 0;font-size:calc(13px*var(--fz,1));font-weight:500;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.grid button.pass{border-color:var(--ok);color:var(--ok)}
.grid button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.lpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.lp{display:flex;flex-direction:column;gap:6px}
.lpbtn{width:100%;padding:10px 6px;font-size:calc(16px*var(--fz,1));font-weight:700;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.lpbtn small{display:block;font-size:calc(12px*var(--fz,1));font-weight:400;margin-top:2px;opacity:.8}
.lpkinds{display:flex;gap:6px}
.lpkinds button{flex:1;padding:5px 4px;font-size:calc(12px*var(--fz,1));font-weight:500;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.lpbtn.on,.lpkinds button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid.toc{grid-template-columns:1fr;gap:5px}
.grid.toc button{text-align:left;padding:10px 12px;font-size:calc(14.5px*var(--fz,1));border-radius:10px;font-variant-numeric:normal}
.npick{margin:0 0 8px}.npick select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.selbar{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 25%)}
.selbar .card{margin:0;display:grid;gap:8px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-block;font-size:calc(12px*var(--fz,1));font-weight:700;padding:2px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-right:6px;white-space:nowrap}
.src{font-size:calc(12px*var(--fz,1));font-weight:600;color:var(--sub);margin-right:6px}
.q h3{font-size:calc(16px*var(--fz,1));margin:0 0 10px;font-weight:600;line-height:1.5}
.passage,.given,.sbox,.chunk{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(17px*var(--fz,1));line-height:1.7}
.passage{background:var(--box);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.passage p{margin:0 0 10px}.passage p:last-child{margin:0}
.given{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;margin:0 0 10px}
.sbox{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;margin:0 0 12px}
u{text-decoration-thickness:1.5px;text-underline-offset:3px}
.nemo{white-space:nowrap;border:1.5px solid var(--ink);border-radius:4px;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:6px}
.opt.en{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16.5px*var(--fz,1))}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.subq{margin-top:14px}
.subq h4{font-size:calc(15px*var(--fz,1));margin:0 0 8px;font-weight:600}
.saline{display:grid;gap:6px;margin-bottom:12px}
.saline .prompt{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16.5px*var(--fz,1))}
.saline input{width:100%}
.saline input.right{border-color:var(--ok);background:var(--okbg)}
.saline input.wrong{border-color:var(--ng);background:var(--ngbg)}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pick .lab{font-weight:600;min-width:34px}
.pick .opt{padding:7px 12px}
.mark{font-weight:800;margin-left:6px}.mark.o{color:var(--ok)}.mark.x{color:var(--ng)}
.mq{font-size:calc(17px*var(--fz,1));line-height:1.8;margin:2px 0 10px}.mq p{margin:0 0 6px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.12;margin:0 .1em;font-variant-numeric:tabular-nums}.fr>span:first-child{border-bottom:1.4px solid currentColor;padding:0 .2em .06em}.fr>span:last-child{padding:.06em .2em 0}
.mq svg,.opt svg,.ex svg{max-width:100%;height:auto;vertical-align:middle}.fig{display:block;margin:6px auto 2px}.bx{display:inline-block;min-width:1.5em;height:1.25em;border:1.5px solid currentColor;border-radius:2px;vertical-align:middle;margin:0 .12em}
.ex{white-space:pre-line;margin-top:10px;font-size:calc(14px*var(--fz,1));padding:10px 12px;border-left:3px solid var(--acc);background:var(--acc2);border-radius:0 8px 8px 0}
.banner{text-align:center;padding:24px 16px}
.banner .big{font-size:calc(40px*var(--fz,1));font-weight:800;letter-spacing:2px}
.banner.pass{background:var(--okbg);border-color:var(--ok)}.banner.pass .big{color:var(--ok)}
.banner.fail{background:var(--ngbg);border-color:var(--ng)}.banner.fail .big{color:var(--ng)}
.banner.score{background:var(--acc2);border-color:var(--acc)}.banner.score .big{color:var(--acc)}
.pts{font-size:calc(12px*var(--fz,1));font-weight:700;color:var(--sub);margin-left:4px;white-space:nowrap}
.bottom{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.bottom button{width:100%;padding:14px;font-size:calc(17px*var(--fz,1))}
textarea{display:block;width:100%;font:inherit;font-size:calc(15px*var(--fz,1));line-height:1.55;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;margin:8px 0}
.cert{margin-top:18px;text-align:left}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:calc(14px*var(--fz,1));font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.wrap{white-space:normal;min-width:180px}
th{font-size:calc(12px*var(--fz,1));color:var(--sub);font-weight:600;letter-spacing:.03em}
td button{padding:4px 10px;font-size:calc(13px*var(--fz,1))}
.okc{color:var(--ok);font-weight:700}.ngc{color:var(--ng);font-weight:700}
.h2{font-size:calc(18px*var(--fz,1));margin:0}
.mycert{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mycert button{padding:6px 12px;font-size:calc(14px*var(--fz,1))}
.logrow{border-top:1px solid var(--line);padding:9px 0}
.logrow summary{cursor:pointer;font-variant-numeric:tabular-nums}
.logrow summary span{margin-right:8px}
.wr{margin:10px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:calc(14px*var(--fz,1));display:grid;gap:4px}
.teacherlink{text-align:center;margin:18px 0 0}
.chunk{border-top:1px dashed var(--line);padding:6px 2px}.cl{font-weight:700}
.sumbox,.kobox{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;margin:8px 0 12px;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16.5px*var(--fz,1));line-height:1.65}
.kobox{font-family:inherit;font-size:calc(15px*var(--fz,1));border-width:1px;border-left:3px solid var(--acc)}
.cond,.gw{border:1px dashed var(--sub);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:calc(14px*var(--fz,1));line-height:1.6}
.cond ol,.cond ul{margin:4px 0 0 18px;padding:0}.gwl{font-weight:700;color:var(--acc)}
.passage p.bul{padding-left:12px;text-indent:-12px}
u.ul2{font-weight:600}.vb{border-bottom:1.5px solid var(--ink);font-weight:600;white-space:nowrap}
.slot{font-weight:800;color:var(--ng);padding:0 2px}
.datatbl{border-collapse:collapse;width:100%;font-size:calc(13px*var(--fz,1));margin:0 0 10px;font-family:inherit}
.datatbl caption{font-weight:700;text-align:left;margin-bottom:4px}
.datatbl th,.datatbl td{border:1px solid var(--sub);padding:2px 4px;text-align:center;white-space:normal;font-size:calc(12px*var(--fz,1))}
.hint{color:#64748b;font-size:.92em}
.notice{border:1.5px solid var(--acc);background:var(--acc2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:calc(14px*var(--fz,1));line-height:1.55}
select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);flex:1;min-width:160px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
[hidden]{display:none!important}

.notice{border:1.5px solid var(--acc);background:var(--acc2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:calc(14px*var(--fz,1));line-height:1.6}
a.ghost{display:inline-block;font-size:calc(14px*var(--fz,1));color:var(--acc);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-decoration:none;font-weight:600}
.chap{border-top:1px solid var(--line)}
.chap:first-of-type{border-top:0}
.chap>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;color:var(--ink);padding:12px 2px;font-weight:600;text-align:left;border-radius:0}
.chap>button .n{font-size:calc(12.5px*var(--fz,1));font-weight:500;color:var(--sub);white-space:nowrap}
.chap>button .n.ok{color:var(--ok);font-weight:700}
.secs{display:grid;gap:8px;padding:0 0 14px}
.secs button{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px 12px;font-size:calc(14.5px*var(--fz,1));font-weight:600;line-height:1.4}
.secs button .u{display:block;font-size:calc(12.5px*var(--fz,1));font-weight:500;color:var(--sub);margin-top:2px}
.secs button .st{display:inline-block;font-size:calc(12px*var(--fz,1));font-weight:700;margin-top:4px;padding:1px 8px;border-radius:99px;background:var(--box);color:var(--sub)}
.secs button .st.ok{background:var(--okbg);color:var(--ok)}.secs button .st.go{background:var(--acc2);color:var(--acc)}
.secs button.hit{border:2px solid var(--acc)}
.find{display:flex;gap:8px;align-items:center;margin-top:12px}
.find input{width:110px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:3px 12px;font-size:calc(13px*var(--fz,1));font-weight:700}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 14px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.wx h3{margin:0 0 10px;font-size:calc(16px*var(--fz,1));display:flex;justify-content:space-between;align-items:center;gap:8px}
.wx h3 .m{font-size:calc(13px*var(--fz,1));font-weight:700}.wx h3 .m.o{color:var(--ok)}.wx h3 .m.x{color:var(--ng)}
.wx figure{margin:0 0 6px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;color-scheme:light}
.wx figure img{display:block;width:100%;height:auto}
.wx .tip{font-size:calc(12.5px*var(--fz,1));color:var(--sub);margin:0 0 12px}
.it{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:1px dashed var(--line)}
.it .q{font-weight:800;color:var(--acc);min-width:28px;font-size:calc(15px*var(--fz,1));padding-top:9px}
.it .h{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16.5px*var(--fz,1));line-height:1.5;margin-bottom:5px}
.it .h u{display:inline-block;min-width:44px;border-bottom:1.5px solid var(--sub);text-decoration:none;height:1em;vertical-align:baseline}
.it .free{font-size:calc(11.5px*var(--fz,1));font-weight:700;color:var(--sub);background:var(--box);border-radius:6px;padding:1px 6px;margin-left:6px;font-family:"Malgun Gothic","Noto Sans KR",sans-serif}
.it input,.it textarea{width:100%;font:calc(17px*var(--fz,1))/1.4 "Malgun Gothic","Noto Sans KR",sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:0}
.it .ok:is(input,textarea){border-color:var(--ok);background:var(--okbg)}
.it .ng:is(input,textarea){border-color:var(--ng);background:var(--ngbg)}
.it .fb{font-size:calc(14px*var(--fz,1));margin-top:5px;line-height:1.5}
.it .fb .a{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16px*var(--fz,1));font-weight:600}
.it .fb.ok{color:var(--ok)}.it .fb.ng{color:var(--ng)}.it .fb.ex{color:var(--sub)}
.banner{border-width:1.5px}.banner .big{font-size:calc(24px*var(--fz,1));font-weight:800;margin-bottom:4px}
.banner.pass{background:var(--okbg);border-color:var(--ok)}.banner.pass .big{color:var(--ok)}
.banner.fail{background:var(--ngbg);border-color:var(--ng)}.banner.fail .big{color:var(--ng)}
.bottom{position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line)}
.bottom button{flex:1;padding:10px 12px;font-size:calc(15px*var(--fz,1))}
textarea{width:100%;font:calc(13px*var(--fz,1))/1.5 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:96px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;overflow:auto;-webkit-overflow-scrolling:touch;cursor:zoom-out}
#zoom img{display:block;width:1200px;max-width:none;margin:0 auto;background:#fff}
#zoom .x{position:fixed;top:10px;right:12px;background:#fff;color:#000;border-radius:99px;padding:6px 14px;font-weight:700}

<style>
/* 모의고사 10단계 워크북(2026-10-21) — 숙제 워크북(giu) 머리·바탕 위에 덧붙이는 부분 */
.kc0{color:#c2410c}.kc1{color:#1d6fc4}.kc2{color:#be185d}.kc3{color:#0f766e}.kc4{color:#6d28d9}
@media (prefers-color-scheme: dark){.kc0{color:#fb923c}.kc1{color:#60a5fa}.kc2{color:#f472b6}.kc3{color:#2dd4bf}.kc4{color:#a78bfa}}
.kw{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.pc{color:var(--c)}   /* e4y WB1: PDF의 색 그대로 */
@media (prefers-color-scheme: dark){.pc{color:color-mix(in srgb,var(--c) 60%,#fff)}}
.kb{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 12px}
.steps button{padding:6px 2px;font-size:calc(13px*var(--fz,1));font-weight:800;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;line-height:1.2}
.steps button small{display:block;font-size:calc(10.5px*var(--fz,1));font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.steps button.go{background:var(--acc2)}
.steps button.on{outline:2.5px solid var(--acc);outline-offset:1px}
.steps button.lk{opacity:.35}
.lockn{margin:-4px 0 10px;font-size:calc(13px*var(--fz,1));line-height:1.5;color:var(--sub)}
.lockn.flash{color:#dc2626;font-weight:700;animation:lkf .45s}
@keyframes lkf{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.wbh{font-size:calc(16px*var(--fz,1));font-weight:800;margin:0 0 2px}.wbh span{color:var(--acc)}
.inst{font-size:calc(13.5px*var(--fz,1));color:var(--sub);margin:0 0 6px}
.ss{padding:11px 0;border-top:1px dashed var(--line)}
.ss:first-of-type{border-top:0}
.ss .n{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-weight:800;color:var(--acc);margin-right:7px;font-size:calc(14px*var(--fz,1))}
.en{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(17px*var(--fz,1));line-height:1.85}
.ko{font-size:calc(14.5px*var(--fz,1));line-height:1.85;margin-top:2px}
.ss.fixl .en,.ss.fixl .ko{color:var(--sub)}
input.bl{font:inherit;display:inline-block;padding:1px 6px;margin:0 2px;border:0;border-bottom:2px solid var(--sub);border-radius:6px 6px 0 0;background:var(--box);color:var(--ink);min-height:0;max-width:100%;vertical-align:baseline}
input.bl:focus{outline:2px solid var(--acc);outline-offset:1px}
input.bl.ok,textarea.ok{border-color:var(--ok);background:var(--okbg)}
input.bl.ng,textarea.ng{border-color:var(--ng);background:var(--ngbg)}
.fbi{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(13px*var(--fz,1));font-weight:800;margin:0 3px}
.fbi.ng{color:var(--ng)}
.vh{font-weight:800;color:var(--acc)}
.opt{display:inline-flex;border:1.5px solid var(--sub);border-radius:8px;overflow:hidden;vertical-align:baseline;margin:0 2px}
.opt button{background:var(--bg);color:var(--ink);padding:0 9px;font:inherit;font-weight:600;border:0;border-radius:0;min-height:0}
.opt button+button{border-left:1.5px solid var(--sub)}
.opt button.sel{background:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok)}.opt.ok button.sel{background:var(--ok)}
.opt.ng{border-color:var(--ng)}.opt.ng button.sel{background:var(--ng)}
.opt.ng button.right{outline:2px dashed var(--ok);outline-offset:-3px}
.p7{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(17px*var(--fz,1));line-height:2}
.u7{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:600;cursor:pointer;border-radius:4px;padding:0 1px}
.u7 sup{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(11px*var(--fz,1));font-weight:800;color:var(--acc);margin-left:1px}
.u7.sel{background:var(--acc2)}.u7.ok{background:var(--okbg);color:var(--ok)}.u7.ng{background:var(--ngbg)}
.u7.miss{outline:2px dashed var(--ng);outline-offset:1px}
.rows7 .it{grid-template-columns:auto 1fr}
.rows7 .h{font-size:calc(15.5px*var(--fz,1))}
.line8{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:6px}
.anch{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16.5px*var(--fz,1));color:var(--sub)}
.zone{flex:1 1 100%;min-height:40px;border:1.5px dashed var(--sub);border-radius:10px;padding:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.zone:empty::before{content:"아래 낱말을 순서대로 누르세요";font-size:calc(12.5px*var(--fz,1));color:var(--sub);padding-left:4px}
.pool{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.chip{background:var(--box);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font:calc(16px*var(--fz,1))/1.35 "Malgun Gothic","Noto Sans KR",sans-serif;font-weight:600;min-height:0}
.zone .chip{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.chip.used{visibility:hidden}
.zone.ok{border:1.5px solid var(--ok);background:var(--okbg)}.zone.ok .chip{background:transparent;border-color:var(--ok);color:var(--ok)}
.zone.ng{border:1.5px solid var(--ng);background:var(--ngbg)}
.ans{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(15.5px*var(--fz,1));font-weight:600;color:var(--ok);margin-top:4px}
.p9box{border:1.5px solid var(--ink);border-radius:10px;padding:10px 13px;margin:8px 0}
.p9box p{margin:0 0 10px;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16.5px*var(--fz,1));line-height:1.75}
.p9box p:last-child{margin:0}
.p9box b{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:var(--acc);margin-right:6px}
.slots{display:flex;gap:8px;align-items:center;margin:10px 0}
.slots .zone{flex:1 1 auto;justify-content:center}
.labs{display:flex;gap:10px}.labs button{flex:1;font-weight:800}
.hbox{background:var(--box);border-radius:6px;padding:4px 10px;text-align:center;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(15.5px*var(--fz,1));margin:6px 0;color:var(--ink)}
.line10{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16.5px*var(--fz,1));line-height:2.1}
textarea.tr{width:100%;font:calc(15px*var(--fz,1))/1.6 "Malgun Gothic","Noto Sans KR",sans-serif;min-height:60px;margin-top:6px}
.exk{font-size:calc(14.5px*var(--fz,1));color:var(--ok);margin-top:4px;line-height:1.7}
.toolrow{display:flex;justify-content:flex-end;gap:8px;margin:10px 0 16px}
.donebtn{width:100%;margin-top:12px}
.bottom #submit{flex:1 1 100%}
.p7 .fx{color:var(--sub)}

   D.enc = base64(iv + AES-256-GCM(gzip JSON)). 열쇠(16진수 64자)는 서버 start 응답 g.key 또는 이 기기에 저장된 값.

      else if (d.a === 'pad') { const c = last && all.has(last) ? last : null; if (!c || c.kind === 'img') { status(c ? '쪽 그림에는 여백을 넣을 수 없습니다' : '여백을 넣을 곳에 먼저 펜을 대세요'); return; } c.q.pad = (c.q.pad || 0) + PAD; ensurePad(c); paint(c); host.save(c); c.pad.scrollIntoView({block: 'nearest', behavior: 'smooth'}); return; }
      keep(); paintBar(); if (ta) ta.el.focus();
    });
    return b;
  }

  return {
    init(h) { host = h; }, mount, unmount, setRecord, bar, status,
    repaint(c) { paint(c); if (sel && sel.c === c) drawSel(); }, refit(c) { fit(c); paint(c); },
    reset() { if (act) discard(); closeText(); clearSel(); undo = []; redo = []; last = null; paintBar(); },
    busy: () => !!act, cancel() { if (act) discard(); }, cards: () => all.size,
    valid: s => s && (s.t ? typeof s.txt === 'string' && Array.isArray(s.p) : Array.isArray(s.p) && s.p.every(Number.isFinite)),
  };
})();

/* 범용 필기 연결(inkpage.js, 2026-11-10) — ink.js 엔진을 시험앱 전용 필기(inknote.js)를 끼울 수 없는 모든 화면에 붙인다:
   교재·지문분석(article), EBS·수업관리 시험(#qs), 워크북(#stepBox·#exs), 교사용 교재(.page 쪽 그림), 최종정리(#root).
   화면 코드는 고치지 않고 body 변화를 보고 스스로 붙는다. 저장은 기기 IndexedDB(획만). 글 카드는 내용 해시로, 쪽 그림은 쪽 번호로, 교재 지문은 id로 찾는다.
   휴대폰(640 이하)과 넓은 화면은 글 배치가 달라 따로 저장. */
(() => {
  if (window.BOOKNOTE || document.getElementById('noteJs') || typeof INK === 'undefined') return;   // 시험앱 전용 필기가 있으면 그쪽이 맡는다
  const DBN = 'exnote', ST = 'rounds', OLD = 200 * 864e5, $ = s => document.querySelector(s);
  let salt0 = ''; try { if (typeof D !== 'undefined' && D && D.salt) salt0 = String(D.salt); } catch (e) {}
  const BOOK = new URLSearchParams(location.search).get('b') || '';
  const SALT = 'book:' + (salt0 || location.pathname.replace(/[^/]*$/, '')), PAGE = (location.pathname.split('/').pop() || 'guide').replace(/\.html$/, ''), NARROW = matchMedia('(max-width:640px)');

  /* ── 저장소 ── */
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((ok, no) => {
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ST, {keyPath: 'id'}).createIndex('salt', 'salt');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  async function tx(mode, f) { const d = await open(); return new Promise((ok, no) => { const t = d.transaction(ST, mode), rq = f(t.objectStore(ST)); let out; if (rq) rq.onsuccess = () => { out = rq.result; }; t.oncomplete = () => ok(out); t.onerror = t.onabort = () => no(t.error); }); }
  const recs = new Map(), dirty = new Set();
  async function load() {
    try {
      const all = await tx('readonly', s => s.index('salt').getAll(SALT)), now = Date.now(), old = [];
      all.forEach(r => { if (r.at && now - r.at > OLD) old.push(r.id); else recs.set(r.id, r); });
      if (old.length) tx('readwrite', s => { old.forEach(id => s.delete(id)); }).catch(() => {});   // 200일 넘게 손대지 않은 필기는 치운다
    } catch (e) {}
  }
  let cards = new Map(), cand = new Map(), timer = 0, stimer = 0;
  async function flush() {
    clearTimeout(timer); timer = 0; const list = [...dirty]; dirty.clear();
    try { for (const q of list) { await tx('readwrite', s => q.s.length ? s.put(q) : s.delete(q.id)); } if (list.length) INK.status('저장됨'); }
    catch (e) { INK.status('저장 실패'); }
  }
  function save(q) { dirty.add(q); q.at = Date.now(); if (q.s.length) recs.set(q.id, q); else recs.delete(q.id); INK.status('저장 중…'); clearTimeout(timer); timer = setTimeout(flush, 1000); }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  /* ── 어디에 붙나 ── */
  const SKIP = '.top,.bot,.panel,nav,header,footer,script,style,svg,[hidden],.ink-x,.ink-pad', INKSEL = '.ink-l,.ink-x,.ink-pad,#inkBar,#inkTop,#inkLive';
  function candidates() {
    const out = new Map(), add = (els, kind) => { for (const el of els) if (el.nodeType === 1 && !out.has(el)) out.set(el, kind); };
    const qs = $('#qs'); if (qs) add(qs.children, 'text');
    const exs = $('#exs'); if (exs) add(exs.children, 'text');
    const sb = $('#stepBox'); if (sb && [...sb.children].some(x => !x.matches(INKSEL))) add([sb], 'text');
    const app = $('#app');
    if (app) {
      const arts = app.querySelectorAll('main > article');
      if (arts.length) add(arts, 'book');
      else { const pg = app.querySelectorAll('.page'); if (pg.length) add(pg, 'img'); else add(kids(app), 'text'); }
    }
    const root = $('#root'); if (root) add(kids(root), 'text');
    const view = $('#view') || $('#main'); if (view && !app && !root) add(kids(view), 'text');   // 11-10 통합앱·선생님 앱·학습 현황·일정표(목록·현황 화면)에도 필기
    add(document.querySelectorAll('.gc-month'), 'text');   // 11-10 일정표 달력: 달 블록 하나 = 카드 하나(학생·달로 저장)
    return out;
  }
  // 뿌리의 자식 가운데 필기 카드가 될 것 — 달력(.gc-month)을 품은 칸은 통째로 붙이지 않고 그 안의 .card만(달력은 달 블록으로 따로)
  const kids = root => { const out = []; for (const x of root.children) { if (x.nodeType !== 1 || x.matches(SKIP)) continue; if (x.querySelector('.gc-month')) { for (const c of x.querySelectorAll('.card')) if (!c.querySelector('.gc-month') && !c.closest('.gc-wrap')) out.push(c); } else out.push(x); } return out; };
  const vis = el => el.getClientRects().length > 0;
  function norm(el) {   // 카드의 내용 지문(指紋): 그림·음원 파일 이름 + 글자(빈칸에 쓴 답·글상자는 들어가지 않는다)
    let t = ''; el.querySelectorAll('[data-enc],img[src]').forEach(i => { const k = i.dataset.enc || i.getAttribute('src') || ''; if (k && !/^(blob|data):/.test(k)) t += k + '|'; });
    return t + (el.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function hash(s) { let a = 2166136261, b = 5381; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = (Math.imul(b, 33) + c) | 0; } return (a >>> 0).toString(36) + (b >>> 0).toString(36); }
  const sigs = new WeakMap();
  function ident(el, kind) {   // {id, …} — 글 카드는 내용이 그대로면 다시 계산하지 않는다
    if (kind === 'book') return {id: `${SALT}:${PAGE}:${(location.hash.match(/^#g(\d+)/) || [])[1]}:${el.id}:${NARROW.matches ? 'm' : 'w'}`};
    if (kind === 'img') return {id: `${SALT}:${PAGE}:${BOOK}:p${el.dataset.p || new URLSearchParams(location.search).get('p') || 1}`};
    if (el.classList.contains('gc-month')) return {id: `${SALT}:${PAGE}:cal:${(el.closest('.gc-wrap') || {dataset: {}}).dataset.ink || ''}:${el.id}`};   // 일정표: 학생·달로 고정(내용이 바뀌어도 같은 카드)
    const sig = (el.textContent || '').length + '/' + el.querySelectorAll('[data-enc],img[src]').length, old = sigs.get(el);
    if (old && old.sig === sig) return old;
    // head = 첫머리(「3. 주제」처럼 번호+유형 두 글자, 번호가 없으면 24자), probes = 본문 가운데 두 토막. 채점으로 해설·정오 표시가 덧붙어도 토막은 남는다 → 같은 카드로 본다
    const n = norm(el), L = n.length, v = {sig, n, id: `${SALT}:${PAGE}:t:${hash(n)}:${NARROW.matches ? 'm' : 'w'}`, head: (n.match(/^\d+\s*[.)]\s*\S{0,2}/) || [n.slice(0, 24)])[0], probes: [n.substr(L / 3 | 0, 40), n.substr(2 * L / 3 | 0, 40)]};
    sigs.set(el, v); return v;
  }
  const same = (c, v) => c.probes.some(p => v.n.includes(p));
  const blank = (id, kind) => ({id, salt: SALT, page: PAGE, kind, w: 0, s: []});
  const tag = (c, v) => { c.sig = v.sig; c.head = v.head || ''; c.probes = v.probes || ['']; c.len = v.n ? v.n.length : 0; return c; };
  function mount(el, kind, q, v) { const c = tag(INK.mount(el, kind, q), v); cards.set(el, c); return c; }
  function unmount(c) { INK.unmount(c); cards.delete(c.el); }

  function sync() {
    stimer = 0; cand = candidates(); const gone = [];   // 같은 문항이 새로 그려지면(채점 뒤 다시 그리기) 필기를 넘겨준다
    for (const [el, c] of [...cards]) {
      if (cand.has(el) && el.isConnected && c.svg.parentNode === el) continue;
      if (c.kind === 'text' && c.q.s.length && c.len >= 40) gone.push(c);
      unmount(c);
    }
    let any = false;
    for (const [el, kind] of cand) {
      if (!any && vis(el)) any = true;
      const c = cards.get(el), v = ident(el, kind);
      if (c) {
        if (INK.busy()) continue;
        if (kind === 'img') { if (v.id !== c.q.id) INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); }
        else if (kind === 'text' && v.sig !== c.sig) { const keepIt = same(c, v); if (keepIt) c.sig = v.sig; else { INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); tag(c, v); } }   // 카드는 그대로인데 속 내용이 통째로 바뀐 경우
        continue;
      }
      let q = recs.get(v.id);
      if (!q && kind === 'text') { const g = gone.find(g => g.head === v.head && g.q.id !== v.id && g.probes.every(p => v.n.includes(p))); if (g) { q = {...g.q, id: v.id, s: g.q.s.map(s => ({...s, p: s.p.slice()}))}; save(q); } }
      if (q) mount(el, kind, q, v);
    }
    INK.bar(any);
  }
  const schedule = () => { if (!stimer) stimer = setTimeout(sync, 60); };
  const ours = n => n.nodeType === 1 && n.matches && n.matches(INKSEL);
  const mine = m => {
    const t = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (t && t.closest(INKSEL)) return true;
    if (m.type === 'childList') { const ns = [...m.addedNodes, ...m.removedNodes]; return ns.length > 0 && ns.every(ours); }
    return false;
  };
  new MutationObserver(ms => { if (!ms.every(mine)) schedule(); }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'src']});
  addEventListener('hashchange', schedule); addEventListener('popstate', schedule);
  NARROW.addEventListener('change', async () => { await flush(); [...cards.values()].forEach(unmount); sync(); INK.status('이 방향에서 쓴 필기만 보입니다'); });

  INK.init({
    save: c => save(c.q), onPen: schedule,
    cardAt(t) {   // 펜이 닿은 자리의 카드 — 필기가 없던 카드는 이때 필기층을 만든다
      cand = candidates(); let el = null; for (let n = t; n && n !== document.body; n = n.parentElement) if (cand.has(n)) { el = n; break; }
      if (!el) return null;
      let c = cards.get(el); if (c && c.svg.parentNode !== el) { unmount(c); c = null; }
      if (!c) { const kind = cand.get(el), v = ident(el, kind); c = mount(el, kind, recs.get(v.id) || blank(v.id, kind), v); }
      return c;
    },
  });
  window.BOOKNOTE = {dump: () => tx('readonly', s => s.index('salt').getAll(SALT)), cards: () => cards.size};
  load().then(sync);
})();
</script>
<script id="tdevJs">
/* 선생님 기기 자동 등록(2026-11-10 사용자: 아이패드가 앱마다 「다른 학생 이름으로 등록」으로 막힘 → 「모든 앱을 고쳐」).
   기기ID는 앱·홈 화면 앱마다 따로 생긴다. 이 브라우저에 선생님 코드가 있으면 저장소의 모든 기기ID를 서버(tdev)에 등록해 이름 잠금·경고에서 뺀다.
   코드가 없는 기기는 이름 칸에 선생님 코드를 한 번 치면 등록된다(코드는 서버가 확인, 화면·주소에 남기지 않는다). tdev_all.py가 게시 때마다 끼운다. */
(function () {
  var U = 'https://script.google.com/macros/s/AKfycbyKGf4h-cdSKteg8QPTjZTvUVsbowp4S0WvaRuyzjFq4Xwm1nc9mOKl70P0tqKzyOKm/exec', RX = /^[A-Za-z0-9.-]{3,40}$/, busy = false, tries = 0, bad = {};
  function val(k) { var v = null; try { v = localStorage.getItem(k); v = JSON.parse(v); } catch (e) {} return typeof v === 'string' ? v : ''; }
  function keys(re) { var a = []; try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (re.test(k)) a.push(k); } } catch (e) {} return a; }
  function ids() { var a = []; keys(/(^|:)device$/).forEach(function (k) { var v = val(k); if (RX.test(v) && a.indexOf(v) < 0) a.push(v); }); return a.sort(); }
  function codes() { var a = []; ['leess:tcode'].concat(keys(/(^|:)tcode$/)).forEach(function (k) { var v = val(k); if (v && a.indexOf(v) < 0) a.push(v); }); return a; }
  function post(code, devs) {
    return fetch(U, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({event: 'tdev', code: code, devs: devs})})
      .then(function (r) { return r.text(); }).then(function (t) { try { return !!JSON.parse(t).ok; } catch (e) { return false; } }).catch(function () { return null; });
  }
  function sync(codeIn) {   // true = 등록됨
    var devs = ids(), sig = devs.join(',');
    if (!devs.length || busy) return Promise.resolve(false);
    var cs = codeIn ? [codeIn] : codes().filter(function (c) { return bad[c] !== sig; });
    if (!cs.length) return Promise.resolve(false);
    if (!codeIn && val('leess:tcode') && localStorage.getItem('leess:tdevs') === sig) return Promise.resolve(true);
    busy = true;
    var i = 0;
    function next() {
      if (i >= cs.length) return false;
      var c = cs[i++];
      return post(c, devs).then(function (ok) {
        if (ok) { try { localStorage.setItem('leess:tdevs', sig); localStorage.setItem('leess:tcode', JSON.stringify(c)); } catch (e) {} return true; }
        if (ok === false) bad[c] = sig;
        return next();
      });
    }
    return Promise.resolve(next()).then(function (r) { busy = false; return r; }, function () { busy = false; return false; });
  }
  var t1 = 0, t2 = 0;
  function later() { clearTimeout(t1); t1 = setTimeout(function () { sync(); }, 900); }
  function isName(el) { return el && el.tagName === 'INPUT' && (el.id === 'name' || /이름/.test(el.getAttribute('placeholder') || '')); }
  document.addEventListener('input', function (e) {   // 이름 칸에 선생님 코드를 치면 등록
    var el = e.target; if (!isName(el)) return;
    clearTimeout(t2);
    t2 = setTimeout(function () {
      var v = (el.value || '').trim();
      if (!/^[!-~]{4,40}$/.test(v) || tries >= 6) return;
      tries++;
      sync(v).then(function (ok) { if (ok && (el.value || '').trim() === v) { el.value = ''; try { el.dispatchEvent(new Event('input', {bubbles: true})); } catch (e) {} alert('선생님 기기로 등록했습니다. 이제 학생 이름으로 들어가시면 됩니다.'); } });
    }, 700);
  }, true);
  document.addEventListener('click', later, true);   // 앱 안에서 코드를 넣은 직후(일곱 번 누르기 등)에도 바로 등록
  document.addEventListener('visibilitychange', function () { if (!document.hidden) later(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', later); else later();
  setTimeout(function () { sync(); }, 3000);
})();
</script>
